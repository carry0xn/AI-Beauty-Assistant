[project]
name = "vision-service"
version = "0.1.0"
description = "Aura vision service scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0,<0.31.0",
  "pydantic>=2.9.0,<3.0.0",
  "mediapipe>=1.0.0",
  "opencv-python-headless>=4.10.0",
  "numpy>=1.26.0",
  "pika>=1.3.0",
  "boto3>=1.34.0",
  "httpx>=0.27.0",
  "pypdf>=4.3.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "httpx>=0.27.0,<0.28.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
